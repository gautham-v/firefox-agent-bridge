<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Firefox Agent Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Firefox Agent Bridge</h1>
      <p id="status" class="muted">Idle</p>
    </div>
    <!-- Resume all goes left of Stop, so Stop doesn't move under the cursor when it appears. -->
    <button id="resume-all" hidden>Resume all</button>
    <button id="stop" class="danger">Stop</button>
  </header>
  <p class="muted small" id="shortcut"></p>

  <section id="sessions-section" hidden>
    <h2>Sessions</h2>
    <ul id="session-list"></ul>
  </section>

  <section>
    <h2>Clients</h2>
    <p class="muted small">Names are self-reported by the program that connects; check the process id and folder.</p>
    <ul id="client-list"></ul>
    <p id="clients-empty" class="muted small">No client connected.</p>
    <div id="blocked-block" hidden>
      <h3>Disconnected until you unblock them or Firefox restarts</h3>
      <ul id="blocked-list"></ul>
    </div>
  </section>

  <section>
    <div class="row">
      <h2>Activity</h2>
      <select id="filter" aria-label="Filter by session"><option value="">All sessions</option></select>
    </div>
    <div class="row buttons">
      <button id="copy">Copy as JSON</button>
      <button id="clear">Clear</button>
      <span id="copied" class="muted small"></span>
    </div>
    <ol id="log"></ol>
    <p id="log-empty" class="muted small">No calls yet.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>

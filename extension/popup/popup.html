<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Firefox Agent Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <span id="orb" class="orb"></span>
    <div class="grow">
      <div id="status" class="title">Idle</div>
      <div id="detail" class="cap"></div>
    </div>
    <!-- Resume all goes left of Stop, and Stop has a fixed width, so Stop doesn't move under the
         cursor when the state changes. -->
    <button id="resume-all" class="b" hidden>Resume all</button>
    <button id="stop" class="b solid">Stop</button>
  </header>

  <div class="sep"></div>

  <section>
    <div class="hdr"><span class="cap">Sessions</span><span class="cap faint">names are self-reported</span></div>
    <ul id="session-list"></ul>
    <p id="sessions-empty" class="empty cap">No agent has connected yet.</p>
    <p id="blocked-note" class="empty cap" hidden>Disconnected until you unblock them or Firefox restarts.</p>
  </section>

  <div class="sep"></div>

  <section>
    <button id="activity-toggle" class="row btn" aria-expanded="false" aria-controls="activity">
      <span class="grow">Activity</span><span id="log-count" class="r"></span><span class="chev" aria-hidden="true"></span>
    </button>
    <div id="activity" hidden>
      <div class="hdr">
        <select id="filter" aria-label="Filter by session"><option value="">All sessions</option></select>
        <span id="copied" class="cap"></span>
      </div>
      <ol id="log"></ol>
      <p id="log-empty" class="empty cap">No calls yet.</p>
    </div>
  </section>

  <div class="sep"></div>

  <footer class="foot">
    <span id="shortcut" class="cap"></span>
    <span class="links"><button id="copy" class="link">Copy log</button><button id="clear" class="link">Clear</button></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
